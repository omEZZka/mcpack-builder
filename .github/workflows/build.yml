name: Build signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build with the fixed signing key
        env:
          SIGNING_STORE: ${{ secrets.MCPACK_KEYSTORE_BASE64 }}
          MCPACK_PASSWORD: ${{ secrets.MCPACK_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f mcpack.keystore' EXIT
          printf '%s' "$SIGNING_STORE" | base64 --decode > mcpack.keystore
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MCPackBuilder-release
          path: app/build/outputs/apk/release/app-release.apk
